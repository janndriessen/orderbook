[workspace]
resolver = "3"
# Listed one by one: `crates/*` would also match `crates/adapters`, which holds
# no manifest of its own, and fail to load.
members = [
  "crates/engine",
  "crates/generator",
  "crates/harness",
  "crates/matching",
  "crates/protocol",
  "crates/replayer",
  "crates/adapters/*",
]

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[workspace.dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22.1"
engine = { path = "crates/engine" }
flate2 = "1.1.10"
futures-util = "0.3.34"
generator = { path = "crates/generator" }
hyperliquid-adapter = { path = "crates/adapters/hyperliquid" }
matching = { path = "crates/matching" }
protocol = { path = "crates/protocol" }
rand = "0.10.3"
rand_chacha = "0.10.0"
rustls = { version = "0.23.36", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.30.0"
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = { version = "12.0.1", features = ["format"] }
