<text x="570" y="80" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">Flow log</text>
<text x="570" y="104" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#B4B2A9" text-anchor="middle" dominant-baseline="central">All events</text>
<text x="570" y="124" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#B4B2A9" text-anchor="middle" dominant-baseline="central">Filter, pause</text>
