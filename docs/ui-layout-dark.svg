<svg xmlns="http://www.w3.org/2000/svg" width="680" height="290" viewBox="0 0 680 290" role="img">
<title>Web UI layout, flow log closed and open</title><desc>Left: the order book is centered with asks above bids and a toggle button bottom-right. Right: with the log open, the screen splits into halves, the book centered in the left half and the flow log centered in the right half.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9c9a92" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="290" fill="#0d1117"/>
<rect x="40" y="40" width="280" height="200" rx="8" fill="#161b22" stroke="#5F5E5A" stroke-width="0.75"/>
<rect x="360" y="40" width="280" height="200" rx="8" fill="#161b22" stroke="#5F5E5A" stroke-width="0.75"/>
<rect x="140" y="52" width="80" height="78" rx="4" fill="#791F1F" stroke="#F09595" stroke-width="0.75"/>
<text x="180" y="91" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#F7C1C1" text-anchor="middle" dominant-baseline="central">Asks</text>
<rect x="140" y="134" width="80" height="12" rx="2" fill="#444441" stroke="#B4B2A9" stroke-width="0.75"/>
