<text x="180" y="189" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#C0DD97" text-anchor="middle" dominant-baseline="central">Bids</text>
<rect x="288" y="210" width="24" height="20" rx="4" fill="#444441" stroke="#B4B2A9" stroke-width="0.75"/>
<path d="M500 48 L500 232" fill="none" stroke="#9c9a92" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="395" y="52" width="70" height="78" rx="4" fill="#791F1F" stroke="#F09595" stroke-width="0.75"/>
<text x="430" y="91" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#F7C1C1" text-anchor="middle" dominant-baseline="central">Asks</text>
<rect x="395" y="134" width="70" height="12" rx="2" fill="#444441" stroke="#B4B2A9" stroke-width="0.75"/>
