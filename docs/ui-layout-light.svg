<svg xmlns="http://www.w3.org/2000/svg" width="680" height="290" viewBox="0 0 680 290" role="img">
<title>Web UI layout, flow log closed and open</title><desc>Left: the order book is centered with asks above bids and a toggle button top right. Right: with the log open, the screen splits into halves, the book centered in the left half and the flow log centered in the right half, with the toggle at the right end of its toolbar.</desc>
