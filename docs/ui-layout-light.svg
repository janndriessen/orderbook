<svg xmlns="http://www.w3.org/2000/svg" width="960" height="290" viewBox="0 0 960 290" role="img">
<title>Web UI layout, flow log closed, open and in a narrow window</title><desc>Left: the order book is centered with asks above bids, a price-grouping menu at the top right of the book panel and a toggle button top right. Right: with the log open, the screen splits into halves, the book with its grouping menu in its top right corner, centered in the left half and the flow log centered in the right half, with the toggle at the right end of its toolbar. Third panel: in a narrow window the flow log is stacked below the book, each one window tall, with the toggle at the top right.</desc>
