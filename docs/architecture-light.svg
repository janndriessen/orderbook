<svg xmlns="http://www.w3.org/2000/svg" width="680" height="650" viewBox="0 0 680 650" role="img">
<title>Order book system architecture</title><desc>Three input sources feed a replayer, which sends commands to the order book service (gateway, matching engine, publisher). The publisher streams events to the web app and test harness; Hyperliquid data also serves as a correctness oracle for the harness.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="650" fill="#ffffff"/>
<rect x="40" y="40" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="130.0" y="58" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">Hyperliquid data</text>
<text x="130.0" y="78" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Recordings or live feed</text>
<rect x="250" y="40" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="340.0" y="58" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">Synthetic generator</text>
<text x="340.0" y="78" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Random + fuzz flow</text>
<rect x="460" y="40" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="550.0" y="58" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">Scenarios</text>
<text x="550.0" y="78" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Hand-written tests</text>
<path d="M130 96 L130 134" fill="none" stroke="#73726c" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="40" y="136" width="180" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="130.0" y="158.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Hyperliquid adapter</text>
<path d="M130 180 L130 200 L270 200 L270 218" fill="none" stroke="#73726c" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M340 96 L340 218" fill="none" stroke="#73726c" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M550 96 L550 200 L410 200 L410 218" fill="none" stroke="#73726c" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="190" y="220" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="340.0" y="238" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Replayer</text>
<text x="340.0" y="258" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">Recorded (paced or stepped) or live</text>
<rect x="40" y="316" width="600" height="176" rx="20" fill="none" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="5 4"/>
<text x="270" y="340" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Order book service</text>
<text x="620" y="340" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">Linked by in-memory queues</text>
<path d="M340 276 L340 296 L150 296 L150 358" fill="none" stroke="#73726c" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="70" y="360" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="150.0" y="378" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">Gateway</text>
<text x="150.0" y="398" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">Validate + sequence</text>
<path d="M230 388 L258 388" fill="none" stroke="#73726c" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="260" y="360" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="340.0" y="378" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">Matching engine</text>
<text x="340.0" y="398" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">In-memory, 1 thread</text>
<path d="M420 388 L448 388" fill="none" stroke="#73726c" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="450" y="360" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="530.0" y="378" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">Publisher</text>
<text x="530.0" y="398" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">Batches every 50 ms</text>
<path d="M150 416 L150 434" fill="none" stroke="#73726c" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="70" y="436" width="160" height="36" rx="8" fill="none" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="5 4"/>
<text x="150" y="454" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Journal (later)</text>
<path d="M500 416 L500 512 L380 512 L380 530" fill="none" stroke="#73726c" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M580 416 L580 530" fill="none" stroke="#73726c" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="300" y="532" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="380.0" y="550" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Web app</text>
<text x="380.0" y="570" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">React, full screen</text>
<rect x="480" y="532" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="560.0" y="550" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Test harness</text>
<text x="560.0" y="570" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">Checks + benchmarks</text>
<path d="M40 68 L20 68 L20 612 L600 612 L600 590" fill="none" stroke="#73726c" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="40" y="630" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Dashed: Hyperliquid L2/L4 used as a correctness oracle</text>
</svg>
